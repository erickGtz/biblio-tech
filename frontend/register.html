<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="left-panel-register">
            <div class="form-container">
                <h2>Registrarse</h2>
                <p class="subtitle">Crea tu cuenta para compartir y descargar apuntes</p>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="nombre">Nombre completo</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre completo" required>
                    </div>
                    <div class="form-group">
                        <label for="apellido_paterno">Apellido paterno</label>
                        <input type="text" id="apellido_paterno" name="apellido_paterno" placeholder="Ingresa tu apellido paterno" required>
                    </div>
                    <div class="form-group">
                        <label for="apellido_materno">Apellido materno</label>
                        <input type="text" id="apellido_materno" name="apellido_materno" placeholder="Ingresa tu apellido materno" required>
                    </div>
                    <div class="form-group">
                        <label for="correo">Correo electrónico</label>
                        <input type="email" id="correo" name="correo" placeholder="tu@correo.com" required>
                    </div>
                    <div class="form-group">
                        <label for="fecha_nacimiento">Fecha de nacimiento</label>
                        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
                    </div>
                    <div class="form-group">
                        <label for="escuela">Institucion educativa</label>
                        <input type="text" id="escuela" name="escuela" placeholder="Nombre de tu institucion" required>
                    </div>
                    <div class="form-group">
                        <label for="grado_academico">Nivel academico</label>
                        <select id="grado_academico" name="grado_academico" required>
                            <option value="">Selecciona tu nivel académico</option>
                            <option value="1">Bachillerato</option>
                            <option value="2">Licenciatura</option>
                            <option value="3">Maestría</option>
                            <option value="4">Doctorado</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="contrasena_reg">Contraseña</label>
                        <input type="password" id="contrasena_reg" name="contrasena" placeholder="Crea una contraseña segura" required>
                    </div>
                    <button type="submit" class="btn-primary">Registrarse</button>
                </form>
                <p class="register-link">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
            </div>
        </div>
        <div class="right-panel-register">
            <img src="img/logo.jpg" alt="Logo" class="logo">
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
