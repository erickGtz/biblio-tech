<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vista General • BiblioTech</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <style>
    /* ====== Estilos mínimos locales para modal y estados del dropzone ====== */
    .modal-backdrop[aria-hidden="true"]{display:none}
    .modal-backdrop[aria-hidden="false"]{display:block}
    .modal-backdrop{
      position:fixed;inset:0;background:rgba(0,0,0,.5);
      display:flex;align-items:center;justify-content:center;z-index:999;
    }
    .modal{background:#fff;border-radius:12px;max-width:720px;width:95%;padding:20px;position:relative}
    .modal-close{position:absolute;top:8px;right:10px;font-size:22px;background:transparent;border:0;cursor:pointer}
    .dropzone{
      border:2px dashed #9ca3af;border-radius:10px;padding:18px;display:block;
      cursor:pointer;text-align:center; transition:background .15s,border-color .15s;
    }
    .dropzone.is-dragover{background:#f2f7ff;border-color:#3b82f6}
    .dropzone .dz-default{display:block}
    .dropzone .dz-selected{display:none}
    .dropzone.has-file .dz-default{display:none}
    .dropzone.has-file .dz-selected{display:flex}
    .dz-selected{align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .dz-file{
      display:flex;align-items:center;gap:10px;
      background:#f1f5f9;border:1px solid #e2e8f0;border-radius:10px;padding:10px 12px;
      max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    .dz-file .name{font-weight:600}
    .dz-file .size{font-size:12px;color:#475569}
    .dz-actions{display:flex;gap:8px}
    .dz-change{background:#e5e7eb;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
    .sr-only{position:absolute;left:-10000px}
    .form-row{display:flex;flex-direction:column;gap:6px;margin:10px 0}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .btn-primary{background:#3b82f6;color:#fff;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
    .btn-secondary{background:#e5e7eb;color:#111;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
    .alert{margin-top:10px;padding:10px;border-radius:8px;font-size:14px}
    .alert-ok{background:#ecfdf5;color:#065f46;border:1px solid #10b981}
    .alert-err{background:#fef2f2;color:#991b1b;border:1px solid #ef4444}
  </style>
</head>
<body>
  <!-- ===== HEADER ===== -->
  <header>
    <div class="logo">BiblioTech</div>
    <div class="search-bar">
      <input type="text">
      <i class="bi bi-search"></i>
      <select id="search-filter">
        <option value="todo">En todo</option>
        <option value="materias">Materias</option>
        <option value="usuarios">Usuarios</option>
      </select>
      <button class="btn">Buscar</button>
    </div>
    <div class="header-right">
      <button class="btn-upload" onclick="abrirSubida()">Subir documento</button>
      <img src="img/avatar.jpg" alt="Usuario" class="profile-img" />
    </div>
  </header>

  <!-- ===== CONTENIDO ===== -->
  <div class="dashboard-container">
    <div class="dashboard-content">
      <h1>Vista General</h1>
      <p class="dashboard-message">Aquí estará la vista general de la aplicación</p>

      <div class="user-info">
        <p>Bienvenido, <span id="userName">Usuario</span></p>
      </div>

      <button onclick="logout()" class="btn-logout">Cerrar Sesión</button>

      <div id="uploadMsg" class="alert" style="display:none"></div>

      <!-- (Aquí puedes renderizar tu listado de apuntes en tarjetas/simple lista) -->
      <div id="listaApuntes"></div>
    </div>
  </div>*/

  <!-- ===== MODAL: SUBIR DOCUMENTO ===== -->
  <div class="modal-backdrop" id="modalUpload" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="uploadTitle">
      <button class="modal-close" aria-label="Cerrar" onclick="cerrarSubida()">×</button>

      <h2 id="uploadTitle">Subir documento</h2>
      <p class="modal-subtitle">Comparte tus apuntes con la comunidad estudiantil</p>

      <!-- Dropzone con estados (default y seleccionado) -->
      <label class="dropzone" id="dropzone" for="fileInput">
        <!-- Estado por defecto -->
        <div class="dz-default">
          <div class="dropzone-icon" style="font-size:28px">⬆️</div>
          <div class="dropzone-text">
            <strong>Arrastra tu archivo aquí</strong> o <u>haz clic para seleccionar</u><br />
            <small>PDF, DOC, DOCX, PPT, PPTX (máx 25 MB)</small>
          </div>
        </div>

        <!-- Estado con archivo seleccionado -->
        <div class="dz-selected">
          <div class="dz-file">
            <i class="bi bi-file-earmark-text"></i>
            <span class="name" id="dzFileName">Archivo seleccionado</span>
            <span class="size" id="dzFileSize">(0 B)</span>
          </div>
          <div class="dz-actions">
            <button type="button" class="dz-change" id="dzChangeBtn">Cambiar archivo</button>
          </div>
        </div>

        <input id="fileInput" name="archivo" type="file" class="sr-only" accept=".pdf,.doc,.docx,.ppt,.pptx" />
      </label>

      <!-- Formulario -->
      <form id="formUpload" class="upload-form">
        <div class="form-row">
          <label for="titulo">Título del documento</label>
          <input id="titulo" name="titulo" type="text" placeholder="Apuntes de Cálculo Integral – Capítulo 3" required />
        </div>

        <div class="form-row">
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" name="descripcion" rows="3" placeholder="Descripción detallada del contenido" required></textarea>
        </div>

        <div class="grid-2">
          <div class="form-row">
            <label for="materia">Materia</label>
            <select id="materia" name="materia" required>
              <option value="" disabled selected>Seleccionar materia</option>
              <option>Matemáticas</option>
              <option>Historia</option>
              <option>Biología</option>
              <option>Física</option>
              <option>Programación</option>
            </select>
          </div>
          <div class="form-row">
            <label for="semestre">Semestre</label>
            <select id="semestre" name="semestre" required>
              <option value="" disabled selected>Seleccionar semestre</option>
              <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
              <option>6</option><option>7</option><option>8</option><option>9</option>
            </select>
          </div>
        </div>

        <div class="grid-2">
          <div class="form-row">
            <label for="universidad">Universidad</label>
            <input id="universidad" name="universidad" type="text" value="BUAP" required />
          </div>
          <div class="form-row">
            <label for="carrera">Carrera</label>
            <input id="carrera" name="carrera" type="text" value="Ingeniería en sistemas" required />
          </div>
        </div>

        <div class="form-row">
          <label for="etiquetas">Etiquetas</label>
          <input id="etiquetas" name="etiquetas" type="text" placeholder="derivadas, límites, funciones, etc" />
        </div>

        <div class="modal-actions" style="display:flex;gap:10px;justify-content:flex-end">
          <button type="button" class="btn-secondary" onclick="cerrarSubida()">Cancelar</button>
          <button type="submit" class="btn-primary">Subir documento</button>
        </div>

        <div id="formMsg" class="alert" style="display:none;"></div>
      </form>
    </div>
  </div>

  <!-- ===== SCRIPTS ===== -->
  <script>
    // === RUTA DEL BACKEND (desde /frontend/dashboard.html) ===
    const UPLOAD_URL = '../backend/controllers/uploadController.php';

    // Abrir/Cerrar modal
    function abrirSubida(){ document.getElementById('modalUpload').setAttribute('aria-hidden','false'); }
    function cerrarSubida(){
      document.getElementById('modalUpload').setAttribute('aria-hidden','true');
      // reset visual + form
      resetDropzoneUI();
      document.getElementById('formUpload').reset();
      document.getElementById('formMsg').style.display='none';
    }

    // ---------- Dropzone ----------
    const dz = document.getElementById('dropzone');
    const fi = document.getElementById('fileInput');
    const dzName = document.getElementById('dzFileName');
    const dzSize = document.getElementById('dzFileSize');
    const dzChangeBtn = document.getElementById('dzChangeBtn');

    function formatBytes(bytes){
      if (bytes === 0) return '0 B';
      const k = 1024, dm = 1, sizes = ['B','KB','MB','GB','TB'];
      const i = Math.floor(Math.log(bytes)/Math.log(k));
      return parseFloat((bytes/Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }

    function setDropzoneFile(file){
      dz.classList.add('has-file');
      dzName.textContent = file.name;
      dzSize.textContent = `(${formatBytes(file.size)})`;
    }

    function resetDropzoneUI(){
      dz.classList.remove('has-file','is-dragover');
      dzName.textContent = 'Archivo seleccionado';
      dzSize.textContent = '(0 B)';
      fi.value = '';
    }

    if (dz && fi) {
      ['dragenter','dragover'].forEach(evt =>
        dz.addEventListener(evt, e => { e.preventDefault(); dz.classList.add('is-dragover'); })
      );
      ['dragleave','drop'].forEach(evt =>
        dz.addEventListener(evt, e => { e.preventDefault(); dz.classList.remove('is-dragover'); })
      );
      dz.addEventListener('drop', e => {
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          fi.files = e.dataTransfer.files;
          setDropzoneFile(e.dataTransfer.files[0]);
        }
      });
      dz.addEventListener('click', () => fi.click());
      fi.addEventListener('change', () => {
        if (fi.files && fi.files[0]) setDropzoneFile(fi.files[0]);
      });
      dzChangeBtn.addEventListener('click', (e) => {
        e.preventDefault();
        fi.click();
      });
    }

    // ---------- Logout ----------
    function logout() {
      fetch('../backend/controllers/authController.php?action=logout', { method: 'POST' })
        .then(() => window.location.href = 'login.html');
    }

    // ---------- Envío del formulario ----------
    const form = document.getElementById('formUpload');
    const formMsg = document.getElementById('formMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      formMsg.style.display='none';

      const file = fi.files && fi.files[0];
      if (!file) { return showFormMsg('Selecciona un archivo.', false); }

      // Validaciones front
      const allowed = ['pdf','doc','docx','ppt','pptx'];
      const ext = file.name.split('.').pop().toLowerCase();
      if (!allowed.includes(ext)) return showFormMsg('Formato no permitido. Usa PDF, DOC, DOCX, PPT o PPTX.', false);
      if (file.size > 25 * 1024 * 1024) return showFormMsg('Archivo mayor a 25 MB.', false);

      const data = new FormData();
      data.append('archivo', file);
      data.append('titulo', document.getElementById('titulo').value.trim());
      data.append('descripcion', document.getElementById('descripcion').value.trim());
      data.append('materia', document.getElementById('materia').value);
      data.append('semestre', document.getElementById('semestre').value);
      data.append('universidad', document.getElementById('universidad').value.trim());
      data.append('carrera', document.getElementById('carrera').value.trim());
      data.append('etiquetas', document.getElementById('etiquetas').value.trim());

      try {
        const res = await fetch(UPLOAD_URL, { method: 'POST', body: data });
        const ct = res.headers.get('content-type') || '';
        if (!ct.includes('application/json')) {
          const txt = await res.text();
          return showFormMsg('Respuesta no JSON del servidor: ' + txt.slice(0, 140) + '...', false);
        }
        const json = await res.json();
        if (json.success) {
          showFormMsg('Documento subido correctamente.', true);
          // Resetear estado del dropzone y cerrar modal
          setTimeout(() => { cerrarSubida(); showTopMsg('Se guardó tu apunte.', true); }, 900);
        } else {
          showFormMsg(json.message || 'No se pudo subir el documento.', false);
        }
      } catch (err) {
        showFormMsg('Error de red: ' + err.message, false);
      }
    });

    function showFormMsg(msg, ok){
      formMsg.textContent = msg;
      formMsg.className = 'alert ' + (ok ? 'alert-ok' : 'alert-err');
      formMsg.style.display='block';
    }
    function showTopMsg(msg, ok){
      const box = document.getElementById('uploadMsg');
      box.textContent = msg;
      box.className = 'alert ' + (ok ? 'alert-ok' : 'alert-err');
      box.style.display='block';
      setTimeout(()=> box.style.display='none', 3000);
    }
  </script>
</body>
</html>
