<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vista General • BiblioTech</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>

<body>
  <!-- ===== HEADER ===== -->
  <header>
    <div class="logo">BiblioTech</div>
    <div class="header-right">
      <button class="btn-upload" onclick="abrirSubida()">Subir documento</button>
      <img src="img/avatar.jpg" alt="Usuario" class="profile-img"/>
    </div>
  </header>

  <!-- ===== CONTENIDO ===== -->
  <div class="dashboard-container">
    <div class="dashboard-content">
      <h1>Vista General</h1>
      <p class="dashboard-message">Aquí estará la vista general de la aplicación</p>

      <div class="user-info">
        <p>Bienvenido, <span id="userName">Usuario</span></p>
      </div>

      <button onclick="logout()" class="btn-logout">Cerrar Sesión</button>
    </div>
  </div>

  <!-- ===== MODAL: SUBIR DOCUMENTO (UI) ===== -->
  <div class="modal-backdrop" id="modalUpload" aria-hidden="true">
    <!-- Ventana emergente -->
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="uploadTitle">
     <!-- Botón (X) para cerrar -->
      <button class="modal-close" aria-label="Cerrar" onclick="cerrarSubida()">×</button>

      <h2 id="uploadTitle">Subir documento</h2>
      <p class="modal-subtitle">Comparte tus apuntes con la comunidad estudiantil</p>

      <!-- Zona donde el usuario puede arrastrar o seleccionar un archivo -->
      <label class="dropzone" id="dropzone" for="fileInput">
        <div class="dropzone-icon">⬆️</div>
        <div class="dropzone-text">
          <strong>Arrastra tu archivo aquí</strong> o <u>haz clic para seleccionar</u><br/>
          <small>PDF, DOC, DOCX, PPT, PPTX (máx 25 MB)</small>
        </div>
        <input id="fileInput" type="file" class="sr-only" accept=".pdf,.doc,.docx,.ppt,.pptx"/>
      </label>

      <!-- Formulario con campos para llenar información del archivo -->
      <form class="upload-form" onsubmit="event.preventDefault();">
        <div class="form-row">
          <label for="titulo">Título del documento</label>
          <input id="titulo" type="text" placeholder="Apuntes de Cálculo Integral – Capítulo 3"/>
        </div>

        <div class="form-row">
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" rows="3" placeholder="Descripción detallada del contenido"></textarea>
        </div>

        <div class="grid-2">
          <div class="form-row">
            <label for="materia">Materia</label>
            <select id="materia">
              <option selected disabled>Seleccionar materia</option>
              <option>Matemáticas</option>
              <option>Historia</option>
              <option>Biología</option>
              <option>Física</option>
              <option>Programación</option>
            </select>
          </div>
          <div class="form-row">
            <label for="semestre">Semestre</label>
            <select id="semestre">
              <option selected disabled>Seleccionar semestre</option>
              <option>1</option><option>2</option><option>3</option>
              <option>4</option><option>5</option><option>6</option>
              <option>7</option><option>8</option><option>9</option>
            </select>
          </div>
        </div>

        <div class="grid-2">
          <div class="form-row">
            <label for="universidad">Universidad</label>
            <input id="universidad" type="text" value="BUAP"/>
          </div>
          <div class="form-row">
            <label for="carrera">Carrera</label>
            <input id="carrera" type="text" value="Ingeniería en sistemas"/>
          </div>
        </div>

        <div class="form-row">
          <label for="etiquetas">Etiquetas</label>
          <input id="etiquetas" type="text" placeholder="derivadas, límites, funciones, etc"/>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="cerrarSubida()">Cancelar</button>
          <button type="submit" class="btn-primary">Subir documento</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== SCRIPTS ===== -->
  <script>
    // Abrir/Cerrar modal
    function abrirSubida() {
      document.getElementById('modalUpload').setAttribute('aria-hidden', 'false');
    }
    function cerrarSubida() {
      document.getElementById('modalUpload').setAttribute('aria-hidden', 'true');
    }

    /* ===== EFECTO DE ARRASTRAR ARCHIVO ===== */
    const dz = document.getElementById('dropzone');
    const fi = document.getElementById('fileInput');
    if (dz && fi) {
        // Cuando el usuario arrastra el archivo encima
      ['dragenter','dragover'].forEach(evt =>
        dz.addEventListener(evt, e => { e.preventDefault(); dz.classList.add('is-dragover'); })
      );
      // Cuando sale el archivo o lo suelta
      ['dragleave','drop'].forEach(evt =>
        dz.addEventListener(evt, e => { e.preventDefault(); dz.classList.remove('is-dragover'); })
      );
      // Cuando suelta el archivo, lo asignamos al input
      dz.addEventListener('drop', e => { fi.files = e.dataTransfer.files; });
       // Si hace clic, abrimos el selector de archivos
      dz.addEventListener('click', () => fi.click());
    }

     /* ===== FUNCIÓN DE LOGOUT ===== */
    function logout() {
      fetch('../../backend/controllers/authController.php?action=logout', { method: 'POST' })
        .then(r => r.json()).catch(() => {})
        .finally(() => window.location.href = 'login.html');
    }
  </script>
</body>
</html>
